[audit]
audit_file = "/tmp/claude-code-permissions-audit.json"
audit_level = "all"

# Allow reading the mermaid.md prompt file
[[allow]]
tool = "Read"
file_path_regex = "^/Users/korny/Dropbox/prj/ai/prompts/mermaid\\.md$"

# Allow npx mermaid-cli mmdc commands (but exclude pipes, background jobs, etc.)
# Note: 2>&1 is allowed for stderr redirection
[[allow]]
tool = "Bash"
command_regex = "^npx -p @mermaid-js/mermaid-cli(@latest)? mmdc "
command_exclude_regex = ";|\\||`|&&|&[^0-9]|&$"

# Allow reading files in /tmp/mermaid (but exclude parent navigation)
[[allow]]
tool = "Read"
file_path_regex = "^/tmp/mermaid"
file_path_exclude_regex = "\\.\\."

# Allow rm commands for mermaid test files (with or without -f)
[[allow]]
tool = "Bash"
command_regex = "^rm (-f )?/tmp/mermaid"
command_exclude_regex = "&|;|\\||`|\\$\\(|\\.\\."

[[allow]]
tool = "Bash"
command_regex = "^curl -s -L -o /tmp/mermaid-download"

[[allow]]
tool = "Bash"
command_regex = "^echo \\$\\$-\\$RANDOM"

[[allow]]
tool = "Bash"
command_regex = "^mv /tmp/mermaid-download"
command_exclude_regex = "&|;|\\||`|\\$\\(|\\.\\."

# Allow writing files in /tmp/mermaid (but exclude parent navigation)
[[allow]]
tool = "Write"
file_path_regex = "^/tmp/mermaid"
file_path_exclude_regex = "\\.\\."
