# Example tool-gate-hook config for Claude Code.
# Copy to ~/.config/tool-gate-hook/claude.toml and adjust.
# Validate with: tool-gate-hook validate --agent claude --config examples/claude.toml
#
# Bash commands are parsed into segments (simple commands): `cargo build 2>&1 && cargo test`
# is two segments. [[command_rule]]s match each segment's `text` (the command and its
# arguments, unquoted, without redirects) or `name`; a Bash call is allowed only when every
# segment is allowed. Anything tool-gate-hook can't check statically (variables, globs,
# substitutions, control structures, ...) turns that allow into an ask.

[audit]
file = "/tmp/tool-gate-hook-claude.jsonl"
level = "matched"      # off | matched | all
max_value_len = 1024   # truncate long strings in the log; 0 = never truncate

# Variables that may be set without asking (`RUST_LOG=debug cargo test`, `env NO_COLOR=1 …`,
# `export CI=1`). Any other assignment asks: PATH, GIT_PAGER, LD_PRELOAD and the like change
# what later commands run.
[shell]
safe_env = ['^RUST_(LOG|BACKTRACE)$', '^NO_COLOR$', '^CI$', '^TERM$', '^LANG$', '^LC_']

# Allow: read-only inspection and the usual Rust workflow
[[command_rule]]
decision = "allow"
description = "cargo workflow"
match.text = { regex = '^cargo (build|test|check|clippy|fmt|run)\b' }

[[command_rule]]
decision = "allow"
description = "read-only git"
match.text = { regex = '^git (status|diff|log|show)\b' }

# Builtins that only print or test. `printf -v NAME` sets a variable, so it isn't included,
# and neither are read, mapfile and getopts. Writes through redirects are checked by the
# construct rule below.
[[command_rule]]
decision = "allow"
description = "harmless builtins"
match.name = { regex = '^(true|false|:|echo|printf|test|\[)$' }
match.text = { not_regex = '^printf -v' }

# Allow: reading anywhere inside the project
[[rule]]
decision = "allow"
tool = "Read"
description = "reads inside the project"
match."tool_input.file_path" = { under = ["{cwd}"] }

# Ask: always prompt for these, even if another rule would allow them
[[command_rule]]
decision = "ask"
description = "git push"
match.text = { regex = '^git push\b' }

[[command_rule]]
decision = "ask"
description = "sudo"
match.name = { equals = "sudo" }

# Shell structure that command rules don't see: a backgrounded command keeps running after
# the call, and a redirect can write to any file
[[construct_rule]]
decision = "ask"
construct = "background"
description = "backgrounded commands"

[[construct_rule]]
decision = "ask"
construct = "redirect_write"
description = "writes outside the project"
outside = ["{cwd}", "/tmp"]

# Commands the hook can't see into: deny rules don't reach the commands they run, so ask
# even when no rule allows them
[[construct_rule]]
decision = "ask"
construct = "shell_reentry"
description = "runs shell code (bash -c, eval, source, ...)"

[[construct_rule]]
decision = "ask"
construct = "exec_tool"
description = "runs other commands (xargs, find -exec)"

[[construct_rule]]
decision = "ask"
construct = "dynamic_command"
description = "command name from a variable or substitution"

# Deny: the model is told why
[[command_rule]]
decision = "deny"
description = "recursive force-delete"
reason = "Recursive force-delete is not allowed"
match.text = { regex = '^rm .*-rf' }

# Matches the command itself, wherever it runs in a chain, but not quoted text such as a
# heredoc or commit message that mentions pip
[[command_rule]]
decision = "deny"
description = "legacy Python tooling"
reason = """
Blocked legacy Python tooling. This environment uses uv exclusively. Use instead:
  uv run <script.py>        (not python/python3 <script.py>)
  uv run python ...         (if you need the interpreter directly)
  uv add <pkg>              (not pip install)
  uv pip install <pkg>      (if you really need pip semantics)
  uv venv                   (not python -m venv / virtualenv)
For standalone scripts, use a PEP 723 `uv run --script` shebang."""
match.name = { regex = '(^|/)(python[0-9.]*|pip[0-9]*|pipenv|virtualenv|pyenv)$' }

[[rule]]
decision = "deny"
tool = "Read|Edit|Write"
description = "secrets files"
reason = "Secrets files are off limits"
match."tool_input.file_path" = { regex = '\.(env|secret)$' }
