# Example tool-gate-hook config for GitHub Copilot CLI.
# Copy to ~/.config/tool-gate-hook/copilot.toml and adjust.
# Validate with: tool-gate-hook validate --agent copilot --config examples/copilot.toml
#
# Copilot tool names are lowercase (bash, view, create, glob, rg, task, apply_patch, ...) and
# the tool's arguments live under `toolArgs`. Seen with a real Copilot CLI: bash has
# `command`, view and create have `path`, glob and rg have `paths` (a directory string).
# File changes depend on the model: `create` (path, file_text) or `apply_patch`, whose
# `toolArgs` is the patch text itself (a string, so no field path); cover both.

[audit]
file = "/tmp/tool-gate-hook-copilot.jsonl"
level = "matched"      # off | matched | all
max_value_len = 1024   # truncate long strings in the log; 0 = never truncate

[patterns]
# Anything that chains or substitutes another command: ; | ` && & (but not 2>&1) $(
# Use as `not_regex = "@shell_chain"` so an allow rule never matches a chained command.
shell_chain = ';|\||`|&&|&[^0-9]|&$|\$\('
# Any ".." path segment; stops an allowed prefix being escaped by navigating upwards
parent_dir = '\.\.'
# python, pip, pipenv, virtualenv or pyenv as the command itself: at the start, after a
# separator (; | & newline ( ) ` $( ), and after any VAR=value prefixes, with an optional path.
# `uv run python` doesn't match because python isn't in command position.
# Quoting isn't understood, so a heredoc or commit message line starting `pip ...` is denied too.
legacy_python = '(^|[;&|\n(`)])\s*([A-Za-z_][A-Za-z0-9_]*=\S*\s+)*(\S*/)?(python(\d+(\.\d+)?)?|pip\d*|pipenv|virtualenv|pyenv)([\s;&|)`]|$)'

[[rule]]
decision = "allow"
tool = "bash"
description = "cargo workflow"
match."toolArgs.command" = { regex = '^cargo (build|test|check|clippy|fmt|run)\b', not_regex = "@shell_chain" }

[[rule]]
decision = "allow"
tool = "bash"
description = "read-only git"
match."toolArgs.command" = { regex = '^git (status|diff|log|show)\b', not_regex = "@shell_chain" }

[[rule]]
decision = "allow"
tool = "view"
description = "views inside the project"
match."toolArgs.path" = { under = ["{cwd}"] }

[[rule]]
decision = "allow"
tool = "glob|rg"
description = "searches inside the project"
match."toolArgs.paths" = { under = ["{cwd}"] }

[[rule]]
decision = "ask"
tool = "bash"
description = "git push"
match."toolArgs.command" = { regex = '^git push\b' }

[[rule]]
decision = "deny"
tool = "bash"
reason = "Recursive force-delete is not allowed"
match."toolArgs.command" = { regex = '^rm .*-rf' }

[[rule]]
decision = "deny"
tool = "bash"
description = "legacy Python tooling"
reason = """
Blocked legacy Python tooling. This environment uses uv exclusively. Use instead:
  uv run <script.py>        (not python/python3 <script.py>)
  uv run python ...         (if you need the interpreter directly)
  uv add <pkg>              (not pip install)
  uv pip install <pkg>      (if you really need pip semantics)
  uv venv                   (not python -m venv / virtualenv)
For standalone scripts, use a PEP 723 `uv run --script` shebang."""
match."toolArgs.command" = { regex = "@legacy_python" }

[[rule]]
decision = "deny"
tool = "view|create"
reason = "Secrets files are off limits"
match."toolArgs.path" = { regex = '\.(env|secret)$' }

# A patch is one string: match the "*** Add/Update/Delete File:" lines in it
[[rule]]
decision = "deny"
tool = "apply_patch"
reason = "Secrets files are off limits"
match."toolArgs" = { regex = '(?m)^\*\*\* (Add|Update|Delete) File: .*\.(env|secret)$' }
