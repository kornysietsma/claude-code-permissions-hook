[package]
name = "tool-gate-hook"
version = "0.1.0"
edition = "2024"
description = "PreToolUse hook that gates Claude Code and Copilot CLI tool use with allow/deny/ask rules"
license = "MIT"
authors = ["Korny Sietsma <korny@sietsma.com>"]
readme = "README.md"
repository = "https://github.com/kornysietsma/tool-gate-hook"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml = "1.1.6"
regex = "1.13.1"
chrono = { version = "0.4.45", features = ["serde"] }
globset = "0.4.20"
brush-parser = "=0.4.0"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
deprecated_safe = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
