[package]
name = "claude-code-permissions-hook"
version = "0.1.0"
edition = "2024"
authors = ["Korny Sietsma <korny@sietsma.com>"]
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
log = "0.4.34"
env_logger = "0.11.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
regex = "1.13.1"
chrono = { version = "0.4.45", features = ["serde"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
