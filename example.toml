# Interim example in the new format; replaced by examples/*.toml in plan step 7.1
[audit]
file = "/tmp/tool-gate-hook-claude.jsonl"
level = "matched"

[patterns]
shell_chain = ';|\||`|&&|&[^0-9]|&$|\$\('
parent_dir = '\.\.'

[[rule]]
decision = "allow"
tool = "Bash"
description = "safe cargo commands"
match."tool_input.command" = { regex = '^cargo (build|test|check|clippy|fmt|run)\b', not_regex = "@shell_chain" }

[[rule]]
decision = "deny"
tool = "Bash"
reason = "Recursive force-delete is not allowed"
match."tool_input.command" = { regex = '^rm .*-rf' }

[[rule]]
decision = "deny"
tool = "Read"
match."tool_input.file_path" = { regex = '\.(env|secret)$' }
